name: Installer bauen

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis,wix
          - os: macos-latest
            formats: dmg
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgbm-dev libxtst-dev libxi-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgtk-3-dev \
            libxdo-dev libwayland-dev clang

      - name: cargo-packager installieren
        run: cargo install cargo-packager --locked

      - name: Installer bauen
        run: cargo packager --release --formats ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: schrittaufzeichner-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
