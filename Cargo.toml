[package]
name = "schrittaufzeichner"
version = "0.1.0"
edition = "2024"
description = "Zeichnet Arbeitsschritte auf: macht bei jedem Mausklick einen Screenshot und erstellt einen HTML-Bericht."
license = "MIT"

[dependencies]
active-win-pos-rs = "0.11"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5.4.5"
rdev = "0.5"
rfd = "0.18.0"
xcap = "0.9"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Installer bauen mit: cargo packager --release
# (Windows: .exe-Installer (NSIS) und .msi, macOS: .app/.dmg, Linux: .deb/AppImage)
[package.metadata.packager]
product-name = "Schrittaufzeichner"
identifier = "ch.schrittaufzeichner.app"
publisher = "Schrittaufzeichner"
category = "Productivity"
description = "Macht bei jedem Mausklick einen Screenshot und erstellt eine Schritt-für-Schritt-Anleitung."
before-packaging-command = "cargo build --release"
out-dir = "dist"
icons = ["assets/icon.png", "assets/icon.ico"]
binaries = [{ path = "schrittaufzeichner", main = true }]

[package.metadata.packager.macos]
info-plist-path = "assets/Info.plist"
